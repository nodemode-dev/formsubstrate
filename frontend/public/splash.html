<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Substrate</title>
  <style>
    html { height: 100%; background: transparent; }
    body { margin: 0; height: 100%; box-sizing: border-box; background: #111111; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 16px; overflow: hidden; color: #a4a4a4; font: 13px -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(50vh - 64px); gap: 18px; }
    img { display: block; }
    p { margin: 0; height: 16px; line-height: 16px; letter-spacing: 0.2px; }
    .bar { width: 180px; height: 3px; border-radius: 2px; background: #222127; overflow: hidden; }
    .fill { width: 100%; height: 100%; border-radius: 2px; background: #a077e0; box-shadow: 0 0 8px rgba(160, 119, 224, 0.45); transform-origin: 0 50%; transform: scaleX(0.04); animation: load 2.6s cubic-bezier(0.25, 0.6, 0.35, 1) forwards; }
    .fill.done { animation: none; transform: scaleX(1); transition: transform 0.2s ease-out; }
    @keyframes load { to { transform: scaleX(0.92); } }
  </style>
</head>
<body><img src="icon.png" width="72" height="72" alt="Substrate"><p>Starting Substrate</p><div class="bar" role="progressbar" aria-label="Starting Substrate"><div class="fill"></div></div><script>
window.formsubstrateSplashDone = function () {
  var fill = document.querySelector('.fill');
  fill.style.transform = getComputedStyle(fill).transform;
  fill.classList.add('done');
  requestAnimationFrame(function () { fill.style.transform = ''; });
};
</script></body>
</html>
